<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-4 py-12">

  <!-- Logo + Título -->
  <div class="flex flex-col items-center mb-8">
    <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-4" style="background-color: #3BA882;">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a4 4 0 0 1 4 4"/>
        <path d="M9.5 4C6.4 4 4 6.4 4 9.5c0 5 6 10.5 8 10.5s8-5.5 8-10.5C20 6.4 17.6 4 14.5 4"/>
      </svg>
    </div>
    <h1 class="text-3xl font-bold text-gray-800">MerendaSegura</h1>
    <p class="text-gray-500 mt-1 text-sm">Monitoramento de merenda escolar</p>
  </div>

  <!-- Card do Formulário -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 w-full max-w-md p-8">

    <h2 class="text-xl font-semibold text-gray-800">Entrar</h2>
    <p class="text-gray-500 text-sm mt-1 mb-6">Selecione seu perfil e faça login</p>

    <!-- Seletor de Perfil -->
    <div class="grid grid-cols-3 gap-3 mb-6">

      <button type="button" (click)="selecionarPerfil('pai')"
        class="flex flex-col items-center justify-center py-4 px-2 rounded-xl border-2 transition-all duration-200"
        [class.border-[#3BA882]]="perfilSelecionado() === 'pai'"
        [class.bg-emerald-50]="perfilSelecionado() === 'pai'"
        [class.text-emerald-700]="perfilSelecionado() === 'pai'"
        [class.border-gray-200]="perfilSelecionado() !== 'pai'"
        [class.text-gray-400]="perfilSelecionado() !== 'pai'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text-xs font-medium text-center leading-tight">Pai/<br>Responsável</span>
      </button>

      <button type="button" (click)="selecionarPerfil('aluno')"
        class="flex flex-col items-center justify-center py-4 px-2 rounded-xl border-2 transition-all duration-200"
        [class.border-[#3BA882]]="perfilSelecionado() === 'aluno'"
        [class.bg-emerald-50]="perfilSelecionado() === 'aluno'"
        [class.text-emerald-700]="perfilSelecionado() === 'aluno'"
        [class.border-gray-200]="perfilSelecionado() !== 'aluno'"
        [class.text-gray-400]="perfilSelecionado() !== 'aluno'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span class="text-xs font-medium">Aluno</span>
      </button>

      <button type="button" (click)="selecionarPerfil('nutricionista')"
        class="flex flex-col items-center justify-center py-4 px-2 rounded-xl border-2 transition-all duration-200"
        [class.border-[#3BA882]]="perfilSelecionado() === 'nutricionista'"
        [class.bg-emerald-50]="perfilSelecionado() === 'nutricionista'"
        [class.text-emerald-700]="perfilSelecionado() === 'nutricionista'"
        [class.border-gray-200]="perfilSelecionado() !== 'nutricionista'"
        [class.text-gray-400]="perfilSelecionado() !== 'nutricionista'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/>
          <path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/>
          <circle cx="20" cy="10" r="2"/>
        </svg>
        <span class="text-xs font-medium">Nutricionista</span>
      </button>

    </div>

    <!-- Campos do formulário -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" [(ngModel)]="email" placeholder="seu@email.com"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none
                 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20
                 transition-all duration-200 placeholder-gray-400" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" [(ngModel)]="senha" placeholder="••••••••"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm outline-none
                 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20
                 transition-all duration-200 placeholder-gray-400" />
      </div>

      <!-- Mensagem de erro -->
      @if (erro()) {
        <p class="text-red-500 text-sm flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ erro() }}
        </p>
      }

      <!-- Botão de login -->
      <button type="button" (click)="entrar()" [disabled]="carregando()"
        class="w-full py-3 rounded-xl text-white font-semibold text-sm
               transition-all duration-200 mt-2 disabled:opacity-60"
        style="background-color: #3BA882;">
        @if (carregando()) {
          <span class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Entrando...
          </span>
        } @else {
          {{ labelBotao }}
        }
      </button>

    </div>

    <!-- Link para cadastro -->
    <p class="text-center mt-6 text-sm">
      <a routerLink="/registro" class="font-medium" style="color: #3BA882;">
        Não tem conta? Cadastre-se
      </a>
    </p>

  </div>
</div>
